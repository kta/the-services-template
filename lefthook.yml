# Git hooks. Auto-installed by the root `prepare` script (`lefthook install`).
#
# 品質ゲートの責務分担:
#   pre-commit … 早期ローカルフィードバック(lint/format + **combined test**)
#   pre-push   … 早期ローカルフィードバック(lint + dependency audit + typecheck + combined test)
#   CI verify  … 最終リモートゲート(agent compatibility + lint + dependency audit + typecheck + combined test)
#
# 緊急時の一時回避は `LEFTHOOK=0 git commit ...` / `git commit --no-verify`。
# 常用しないこと。最終的には CI `verify` が検出するが、早期フィードバックを失う。

pre-commit:
  parallel: false # biome の --write でファイルが変わるため、テストは整形後に走らせる
  # merge / rebase 中は走らせない(コンフリクト解決の途中でテストが落ちるのは当然で、
  # ここで止めると解決作業そのものができなくなる)。
  skip:
    - merge
    - rebase
  commands:
    # 1) 変更ファイルの lint + format(自動修正して stage し直す)
    lint-format:
      priority: 1
      glob: '*.{js,ts,cjs,mjs,jsx,tsx,json,jsonc,css}'
      run: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    # 2) combined test gate (全パッケージ + SPA web)。**落ちたらコミットさせない。**
    #    traceability はここで検証するが、重い Playwright e2e は含めない(手動 / CI 手動トリガ)。
    test:
      priority: 2
      run: pnpm run test

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

# push 前は最終リモートゲートの主要品質検査をローカルで先行実行する。
pre-push:
  parallel: false
  commands:
    # CI と同条件: 書き換えなしの check(format 崩れも lint 違反もここで失敗)
    lint-format:
      priority: 1
      run: pnpm exec biome check .
    dependency-audit:
      priority: 2
      run: pnpm run deps:check
    typecheck:
      priority: 3
      run: pnpm -r --if-present typecheck
    # combined test gate: coverage thresholds + SPA web + E2E traceability
    test:
      priority: 4
      run: pnpm run test
