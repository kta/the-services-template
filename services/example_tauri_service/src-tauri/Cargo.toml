[package]
name = "example_tauri_service"
version = "0.0.0"
description = "Example Tauri service native shell"
authors = ["KTA"]
edition = "2021"
rust-version = "1.88.0"
build = "build.rs"

[lib]
name = "example_tauri_service_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
url = "2.5.8"

[dependencies]
tauri = { version = "2.11.5", features = [] }
reqwest = { version = "0.13.4", default-features = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5.8"
