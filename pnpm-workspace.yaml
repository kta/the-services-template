packages:
  - 'services/*'
  - 'packages/*'

# pnpm 11 defaults to a 24-hour release-age gate. These exact versions were
# reviewed during the 2026-08-22 modernization; future versions remain gated.
minimumReleaseAgeExclude:
  - '@biomejs/biome@2.5.10'
  - '@biomejs/cli-darwin-arm64@2.5.10'
  - '@biomejs/cli-darwin-x64@2.5.10'
  - '@biomejs/cli-linux-arm64-musl@2.5.10'
  - '@biomejs/cli-linux-arm64@2.5.10'
  - '@biomejs/cli-linux-x64-musl@2.5.10'
  - '@biomejs/cli-linux-x64@2.5.10'
  - '@biomejs/cli-win32-arm64@2.5.10'
  - '@biomejs/cli-win32-x64@2.5.10'
  - '@cloudflare/workers-types@5.20260822.1'
  - '@testing-library/user-event@14.6.6'

# Postinstall scripts are opt-in. Keep this allowlist minimal and auditable.
allowBuilds:
  '@biomejs/biome': true
  '@tailwindcss/oxide': true
  esbuild: true
  lefthook: true
  sharp: true
  workerd: true

# Single source of version truth (referenced as "catalog:" in package.json).
catalog:
  typescript: ^7.0.2

  # Backend (Hono Workers)
  hono: ^4.13.3
  '@hono/zod-validator': ^0.9.0
  zod: ^4.4.3
  drizzle-orm: ^0.45.2
  drizzle-kit: ^0.31.10
  wrangler: ^4.125.0
  '@cloudflare/workers-types': ^5.20260822.1

  # Testing
  vitest: ^4.1.11
  '@cloudflare/vitest-pool-workers': ^0.22.0
  '@vitest/coverage-istanbul': ^4.1.11
  '@playwright/test': ^1.62.1
  '@testing-library/dom': ^10.4.1
  '@testing-library/jest-dom': ^7.0.1
  '@testing-library/react': ^16.3.2
  '@testing-library/user-event': ^14.6.6
  jsdom: ^30.0.1

  # Frontend (React + Vite)
  vite: ^8.2.2
  '@vitejs/plugin-react': ^6.1.0
  '@cloudflare/vite-plugin': ^1.53.1
  tailwindcss: ^4.3.3
  '@tailwindcss/vite': ^4.3.3
  react: ^19.2.8
  react-dom: ^19.2.8
  react-router: ^8.3.0
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.4

  # Tooling
  '@biomejs/biome': ^2.5.10
