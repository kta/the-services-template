name: "Agent task"
description: "Well-scoped task an AI agent (or human) can pick up and finish."
title: "task: "
labels: ["agent-task"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: One or two sentences — what should be true when this is done.
    validations:
      required: true
  - type: input
    id: service
    attributes:
      label: Service / area
      description: e.g. example_service, admin, notifier, packages/ui, infra
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Given/When/Then bullets. These should become tests.
      placeholder: |
        - Given …, When …, Then …
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: In scope / out of scope
      placeholder: |
        In: …
        Out: …
  - type: textarea
    id: notes
    attributes:
      label: Notes / pointers
      description: Relevant files, specs, or constraints.
  - type: checkboxes
    id: dod
    attributes:
      label: Definition of done
      options:
        - label: Spec/acceptance written first; tests added (TDD)
          required: true
        - label: "`pnpm check` (lint + typecheck + test) green"
          required: true
        - label: Tenant scoping kept; no `any`; Conventional Commit
          required: true
